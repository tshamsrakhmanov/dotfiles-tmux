set -g mouse on
setw -g mode-keys vi

# color declaration
C_GREY=colour245
C_DARK_GREY=colour236
C_BLACK=black
C_MAGIC=colour118
C_WHITE=white
C_BLUE=blue
C_DARK_BLUE=colour17
C_RED=colour1
C_YELLOW=yellow


# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1

# Renumbering windows (whenever they closed or else)
set -g renumber-windows on

# remap prefix from 'C-b' to 'C-z'
unbind C-b
set-option -g prefix C-z
bind-key C-z send-prefix

# bind reloading config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# change windows-line separator
set -g window-status-separator ' '

# change position of windows list
set -g status-justify absolute-centre

# ACTIVE
set -g window-status-current-format '\
#[bg=#{C_MAGIC}]#[fg=#{C_BLACK}][#{window_index}]#[bg=#{C_BLACK}]\
#[bg=#{C_RED}] #{window_flags} #[bg=#{C_BLACK}]
'

# IN-ACTIVE
set -g window-status-format '\
#[bg=#{C_MAGIC}]#[fg=#{C_BLACK}][#{window_index}]#[bg=#{C_BLACK}]\
#[bg=#{C_GREY}]   #[bg=#{C_BLACK}]
'

# change status right/left lenght
set -g status-right-length 150
set -g status-left-length 50

# change position of status bar to TOP
set -g status-position bottom 

# change colors of pane separators
set -g pane-border-style 'fg=#{C_DARK_GREY}'
set -g pane-active-border-style 'fg=#{C_MAGIC}'

# change color of status bar
set -g status-bg "$C_BLACK"
set -g status-fg "$C_WHITE"

# LEFT status bar
set -g status-left '\
#[bg=#{C_BLUE}]#[fg=#{C_WHITE}] #{user} \
#[bg=#{C_YELLOW}]#[fg=#{C_BLACK}] @ \
#[bg=#{C_DARK_BLUE}]#[fg=#{C_WHITE}] #H '

# RIGHT status bar
set -g status-right ''
